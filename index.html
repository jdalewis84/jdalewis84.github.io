<!doctype html>
<html lang="en-NZ">

  <meta name="description" content="Learn the New Zealand Road Code the fun way: levels, streaks, badges and mock theory tests. Works offline.">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="manifest" href="manifest.webmanifest">
